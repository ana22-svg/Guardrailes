[project]
name = "guardrails-text2sql"
version = "0.1.0"
description = "Schema-aware prompt engine for a guarded text-to-SQL interface."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "sqlparse>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
